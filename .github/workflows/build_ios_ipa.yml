name: Build iOS IPA (LumenBlend)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ios_ipa:
    name: Build Unsigned iOS IPA on macOS Xcode
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dart & Flutter dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS Release (.app without codesign for Sideloadly / AltStore / 爱思助手)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into IPA
        run: |
          mkdir -p build/ipa_payload/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa_payload/Payload/
          cd build/ipa_payload
          zip -qry ../../LumenBlend_iOS_unsigned.ipa Payload
          ls -lh ../../LumenBlend_iOS_unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumenBlend-iOS-IPA
          path: LumenBlend_iOS_unsigned.ipa
          retention-days: 30
